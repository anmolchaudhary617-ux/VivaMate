services:
  - type: web
    name: vivamate-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    rootDir: backend
    envVars:
      - key: AI_PROVIDER
        value: huggingface
      - key: HF_TOKEN
        sync: false
      - key: HF_MODEL
        value: Qwen/Qwen3-4B-Instruct-2507
      - key: CORS_ORIGINS
        value: https://your-frontend.vercel.app
